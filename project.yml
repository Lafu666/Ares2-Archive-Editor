name: AresToolbox
options:
  bundleIdPrefix: com.ares
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AresToolbox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AresToolbox
        excludes:
          - "Resources/**"
    resources:
      - path: AresToolbox/Resources
    info:
      path: AresToolbox/Info.plist
      properties:
        CFBundleDisplayName: 阿瑞斯工具箱
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSDocumentsFolderUsageDescription: 需要访问文件来选择和导出游戏存档
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ares.toolbox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
