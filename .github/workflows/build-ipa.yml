name: Build iOS IPA

# 触发：push 到 main/master 自动跑，或 Actions 页手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (iOS 17 SDK)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          echo "---SDKs---"
          xcodebuild -showsdks | grep -i ios || true
          echo "---xcodegen---"
          xcodegen --version

      - name: Patch PRODUCT_NAME to English (force Ares2Calc)
        run: |
          # 强制把 PRODUCT_NAME 改成英文 Ares2Calc，
          # 让可执行文件名与 Info.plist 的 CFBundleExecutable=Ares2Calc 一致
          sed -i '' 's/PRODUCT_NAME: .*/PRODUCT_NAME: Ares2Calc/' project.yml
          echo "---patched project.yml PRODUCT_NAME line:---"
          grep PRODUCT_NAME project.yml || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        id: archive
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project Ares2Calc.xcodeproj \
            -scheme Ares2Calc \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Ares2Calc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/build.log
          echo "archive_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          echo "---- archive step done ----"

      - name: If archive failed, dump last 120 lines of log
        if: steps.archive.outcome == 'failure' || steps.archive.outputs.archive_exit_code != '0'
        run: |
          echo "❌ Archive failed (exit code: ${{ steps.archive.outputs.archive_exit_code }})"
          echo "==================== last 120 lines of build.log ===================="
          tail -120 build/build.log || true
          echo "===================================================================="
          exit 1

      - name: Verify archive product exists
        run: |
          # 用通配符自动找 .app，不依赖 PRODUCT_NAME 是中文还是英文
          APP_PATH=$(find build/Ares2Calc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive"
            echo "----- xcarchive structure -----"
            find build/Ares2Calc.xcarchive -maxdepth 5 -type d 2>/dev/null || echo "no xcarchive"
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          # 找 archive 里的 .app（不管叫什么名）
          APP_PATH=$(find build/Ares2Calc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          # 复制到 Payload 并强制重命名为 Ares2Calc.app
          # 这样 ipa 内 .app 文件夹名与 Info.plist CFBundleExecutable 一致
          mkdir -p build/Payload
          rm -rf build/Payload/Ares2Calc.app
          cp -R "$APP_PATH" "build/Payload/Ares2Calc.app"
          # 主可执行文件加 +x
          if [ -f "build/Payload/Ares2Calc.app/Ares2Calc" ]; then
            chmod +x "build/Payload/Ares2Calc.app/Ares2Calc"
          fi
          # dylib 也加 +x
          find "build/Payload/Ares2Calc.app" -type f -name "*.dylib" -exec chmod +x {} \; 2>/dev/null || true
          cd build
          zip -qry "Ares2Save-unsigned.ipa" Payload
          mv "Ares2Save-unsigned.ipa" "Ares2Save.ipa"
          echo "===== final ipa ====="
          ls -la "Ares2Save.ipa"
          echo "===== ipa contents ====="
          unzip -l "Ares2Save.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ares2Save-iOS17-unsigned-ipa
          path: build/Ares2Save.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
