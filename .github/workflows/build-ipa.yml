name: Build Unsigned IPA

# 未签名 IPA 构建工作流
# 适用于：本地测试、越狱设备安装、通过 TrollStore 等方式侧载
# 注意：由于 project.yml 中 CODE_SIGNING_ALLOWED=NO，构建出的 IPA 为未签名状态

on:
  # 推送到 main / master 分支时触发
  push:
    branches:
      - main
      - master
    # 仅在标签推送时创建 GitHub Release
    tags:
      - 'v*'
      - 'release-*'
  # Pull Request 时触发（仅构建，不发布 Release）
  pull_request:
    branches:
      - main
      - master
  # 手动触发
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 GitHub Release（仅在标签推送或手动勾选时生效）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 选择 Xcode 版本（macOS-14 镜像自带 Xcode 15+）
      - name: Select Xcode version
        run: |
          echo "可用 Xcode 版本："
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcode-select -p

      # 3. 安装 XcodeGen
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # 4. 生成 Xcode 项目
      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "生成的项目文件："
          ls -la *.xcodeproj

      # 5. 解析 Swift PackageManager 依赖（ZIPFoundation）
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AresToolbox.xcodeproj \
            -scheme AresToolbox

      # 6. 构建应用（未签名，针对通用 iOS 设备）
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project AresToolbox.xcodeproj \
            -scheme AresToolbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # 7. 打包未签名 IPA
      - name: Create unsigned IPA
        run: |
          # 定位构建产物中的 .app
          APP_PATH=$(find build/Build/Products -name "AresToolbox.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 AresToolbox.app，构建可能失败"
            find build/Build/Products -type d || true
            exit 1
          fi
          echo "找到 .app: $APP_PATH"

          # 创建打包目录
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 为 .app 添加权限制止符号链接导致 zip 相对路径问题
          chmod -R 755 Payload

          # 生成 IPA 文件名（含提交信息）
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IPA_NAME="AresToolbox-unsigned-${SHORT_SHA}.ipa"

          # 打包为 IPA（zip 格式，使用 -r 递归，-y 保留符号链接）
          zip -qry "$IPA_NAME" Payload

          echo "IPA 文件信息："
          ls -lh "$IPA_NAME"
          unzip -l "$IPA_NAME" | head -20

          # 保存文件名供后续步骤使用
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      # 8. 上传 IPA 构建产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AresToolbox-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

      # 9. 上传构建日志（便于排查问题）
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      # 10. 创建 GitHub Release（仅在标签推送或手动触发且勾选时）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
