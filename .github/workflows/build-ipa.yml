name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (iOS 17 SDK)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          echo "---SDKs---"
          xcodebuild -showsdks | grep -i ios || true
          echo "---xcodegen---"
          xcodegen --version

      # ── 关键修复：cd 到 ios-app 目录再操作 ──
      - name: Verify project.yml exists
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== ios-app/ ==="
          ls -la ios-app/ || echo "no ios-app dir"
          echo "=== project.yml ==="
          cat ios-app/project.yml || echo "project.yml NOT FOUND"

      - name: Generate Xcode project
        run: |
          cd ios-app
          xcodegen generate
          echo "=== xcodeproj ==="
          ls -la Ares2Calc.xcodeproj || echo "FAILED to generate"

      - name: Build archive (unsigned)
        id: archive
        continue-on-error: true
        run: |
          cd ios-app
          mkdir -p build
          set +e
          xcodebuild archive \
            -project Ares2Calc.xcodeproj \
            -scheme Ares2Calc \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Ares2Calc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/build.log
          echo "archive_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          echo "---- archive step done ----"

      - name: If archive failed, dump log
        if: steps.archive.outcome == 'failure' || steps.archive.outputs.archive_exit_code != '0'
        run: |
          echo "❌ Archive failed (exit code: ${{ steps.archive.outputs.archive_exit_code }})"
          echo "==================== last 120 lines of build.log ===================="
          tail -120 ios-app/build/build.log || true
          echo "===================================================================="
          exit 1

      - name: Verify archive product exists
        run: |
          cd ios-app
          APP_PATH=$(find build/Ares2Calc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive"
            find build/Ares2Calc.xcarchive -maxdepth 5 -type d 2>/dev/null || echo "no xcarchive"
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Patch Info.plist inside .app (safety net)
        run: |
          cd ios-app
          APP_PATH=$(find build/Ares2Calc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          PLIST="$APP_PATH/Info.plist"

          # 确保 CFBundleExecutable 存在
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Ares2Calc" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Ares2Calc" "$PLIST"

          # 确保 ATS 允许本地加载
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null

          echo "✅ Info.plist patched"

      - name: Package unsigned IPA
        run: |
          cd ios-app
          APP_PATH=$(find build/Ares2Calc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)

          mkdir -p build/Payload
          rm -rf build/Payload/Ares2Calc.app
          cp -R "$APP_PATH" "build/Payload/Ares2Calc.app"

          # 可执行权限
          if [ -f "build/Payload/Ares2Calc.app/Ares2Calc" ]; then
            chmod +x "build/Payload/Ares2Calc.app/Ares2Calc"
          fi

          # dylib 权限
          find "build/Payload/Ares2Calc.app" -type f -name "*.dylib" -exec chmod +x {} \; 2>/dev/null || true

          cd build
          zip -qry "Ares2Calc-unsigned.ipa" Payload
          echo "===== final ipa ====="
          ls -la "Ares2Calc-unsigned.ipa"
          echo "===== ipa contents ====="
          unzip -l "Ares2Calc-unsigned.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ares2Calc-iOS-unsigned-ipa
          path: ios-app/build/Ares2Calc-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-app/build/build.log
          if-no-files-found: ignore
