name: iOS IPA Build (iOS 17+, Unsigned)

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    name: Build unsigned IPA (iOS 17+)
    runs-on: macos-14

    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      PROJECT_PATH: ios/DecryptEditor.xcodeproj
      SCHEME: DecryptEditor
      IOS_VERSION: "17.0"
      BUILD_DIR: build/Build
      IPA_EXPORT_PATH: build/ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun --show-sdk-path --sdk iphoneos

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          python3 ios/generate_project.py

      - name: Build .app (unsigned)
        run: |
          BUILD_NUMBER=${{ github.run_number }}

          xcodebuild clean build \
            -project ios/DecryptEditor.xcodeproj \
            -scheme $SCHEME \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -derivedDataPath $BUILD_DIR \
            IPHONEOS_DEPLOYMENT_TARGET=$IOS_VERSION \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            | xcpretty

      - name: Package unsigned IPA
        run: |
          mkdir -p $IPA_EXPORT_PATH/Payload

          APP_PATH=$(find $BUILD_DIR -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo ".app bundle not found!"
            exit 1
          fi
          echo "Found .app: $APP_PATH"

          cp -R "$APP_PATH" $IPA_EXPORT_PATH/Payload/

          cd $IPA_EXPORT_PATH
          zip -qr "../$SCHEME-iOS17-${{ github.event.inputs.configuration || 'Release' }}.ipa" Payload/

          cd ../..
          echo "IPA packaged successfully"

      - name: Verify IPA
        run: |
          IPA_FILE=$(ls build/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "IPA file not found!"
            exit 1
          fi
          echo "IPA generated: $IPA_FILE"
          ls -lh "$IPA_FILE"

          echo "IPA contents:"
          unzip -l "$IPA_FILE" | head -20
          echo "IPA verification passed"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecryptEditor-iOS17-unsigned-${{ github.event.inputs.configuration || 'Release' }}
          path: build/*.ipa
          compression-level: 0
          if-no-files-found: error
