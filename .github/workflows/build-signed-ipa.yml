name: Build Signed IPA

# 签名 IPA 构建工作流
# 适用于：分发到真实设备安装（开发 / Ad-Hoc 分发）
# 需要在仓库 Settings → Secrets and variables → Actions 中配置以下密钥：
#   - BUILD_CERTIFICATE_BASE64        开发者证书（.p12）的 Base64 编码内容
#   - BUILD_PROVISIONING_PROFILE_BASE64 描述文件（.mobileprovision）的 Base64 编码内容
#   - KEYCHAIN_PASSWORD                临时钥匙串的密码（可自定义任意字符串）
#
# 另外在 Settings → Secrets and variables → Actions → Variables 中配置：
#   - TEAM_ID  （可选，也可使用下方 env 占位，建议配置为 Variable）

on:
  # 仅支持手动触发
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式（development / ad-hoc / app-store / enterprise）'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise

# 同一时刻只允许一个签名构建运行，避免证书冲突
concurrency:
  group: signed-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed IPA
    runs-on: macos-14

    # 前置密钥校验：缺失密钥时直接跳过
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      # 0. 校验必需的密钥是否已配置
      - name: Verify required secrets
        run: |
          MISSING=()
          [ -z "$BUILD_CERTIFICATE_BASE64" ] && MISSING+=("BUILD_CERTIFICATE_BASE64")
          [ -z "$BUILD_PROVISIONING_PROFILE_BASE64" ] && MISSING+=("BUILD_PROVISIONING_PROFILE_BASE64")
          [ -z "$KEYCHAIN_PASSWORD" ] && MISSING+=("KEYCHAIN_PASSWORD")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::缺少以下 GitHub Secrets，请前往 Settings → Secrets and variables → Actions 配置："
            for s in "${MISSING[@]}"; do
              echo "  - $s"
            done
            exit 1
          fi
          echo "所有必需密钥已就绪。"

      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 选择 Xcode 版本
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcode-select -p
          # 输出可用的签名身份，便于调试
          security find-identity -v -p codesigning || true

      # 3. 解析 Swift Package Manager 依赖
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AresToolbox.xcodeproj \
            -scheme AresToolbox

      # 4. 创建临时钥匙串
      - name: Create temporary keychain
        run: |
          # 钥匙串名称与密码
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # 创建钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 设置钥匙串为可用（出现在搜索列表）
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          # 解锁钥匙串
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 将临时钥匙串加入搜索列表（置于最前）
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "临时钥匙串已创建并解锁: $KEYCHAIN_PATH"

      # 5. 解码证书并导入钥匙串
      - name: Decode and import certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          # 将 Base64 证书解码为 .p12 文件
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "证书已解码: $CERTIFICATE_PATH"

          # 导入证书到临时钥匙串
          # -T 允许 codesign 与 security 访问该密钥
          security import "$CERTIFICATE_PATH" \
            -P "$KEYCHAIN_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # 允许 codesign 无需提示访问密钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 验证签名身份
          echo "当前可用的签名身份："
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # 6. 解码并安装描述文件
      - name: Decode and install provisioning profile
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          # 将 Base64 描述文件解码
          echo "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          echo "描述文件已解码: $PP_PATH"

          # 获取描述文件的 UUID
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PP_PATH")")
          echo "描述文件 UUID: $PP_UUID"

          # 安装描述文件到 ~/Library/MobileDevice/Provisioning Profiles
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp "$PP_PATH" "$PP_DIR/$PP_UUID.mobileprovision"

          echo "描述文件已安装到: $PP_DIR/$PP_UUID.mobileprovision"
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV

          # 输出描述文件中的 Team ID 与应用 ID，便于核对
          echo "--- 描述文件信息 ---"
          security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin || true
          security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin || true

      # 7. 构建 Archive（已签名）
      - name: Build archive
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/AresToolbox.xcarchive"
          xcodebuild archive \
            -project AresToolbox.xcodeproj \
            -scheme AresToolbox \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
          echo "Archive 构建完成: $ARCHIVE_PATH"

      # 8. 根据选择的导出方式生成 ExportOptions.plist
      - name: Generate ExportOptions.plist
        run: |
          EXPORT_METHOD="${{ github.event.inputs.export_method }}"
          echo "导出方式: $EXPORT_METHOD"

          # 从描述文件中提取 Team ID
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          TEAM_ID=$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin)
          echo "Team ID: $TEAM_ID"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

          # 生成 ExportOptions.plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ares.toolbox</key>
              <dict>
                <key>UUID</key>
                <string>${PP_UUID}</string>
                <key>name</key>
                <string>$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)</string>
              </dict>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF

          echo "--- ExportOptions.plist 内容 ---"
          cat ExportOptions.plist

      # 9. 导出已签名的 IPA
      - name: Export signed IPA
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_DIR"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ExportOptions.plist

          echo "--- 导出目录内容 ---"
          ls -la "$EXPORT_DIR"

          # 定位导出的 IPA
          IPA_PATH=$(find "$EXPORT_DIR" -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::未找到导出的 IPA 文件"
            cat "$EXPORT_DIR/ExportOptions.plist" 2>/dev/null || true
            cat "$EXPORT_DIR/*.log" 2>/dev/null || true
            exit 1
          fi

          # 重命名 IPA（含提交信息与导出方式）
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          EXPORT_METHOD="${{ github.event.inputs.export_method }}"
          FINAL_IPA="$RUNNER_TEMP/AresToolbox-${EXPORT_METHOD}-${SHORT_SHA}.ipa"
          cp "$IPA_PATH" "$FINAL_IPA"

          echo "IPA_PATH=$FINAL_IPA" >> $GITHUB_ENV
          echo "签名 IPA 导出完成: $FINAL_IPA"
          ls -lh "$FINAL_IPA"

      # 10. 上传签名 IPA 构建产物
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AresToolbox-signed-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30
          if-no-files-found: error

      # 11. 上传构建日志（便于排查问题）
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-logs
          path: |
            build/**/*.log
            ${{ env.RUNNER_TEMP }}/export/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      # 12. 清理临时钥匙串与描述文件（安全清理）
      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          # 删除临时钥匙串
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            echo "临时钥匙串已删除"
          fi
          # 删除描述文件
          if [ -n "$PP_UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
            echo "描述文件已删除"
          fi
