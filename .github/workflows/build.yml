name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ares2ToolBox IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "Build configuration: ${{ inputs.configuration || 'Release' }}"

      - name: Build Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Ares2ToolBox.xcodeproj \
            -scheme Ares2ToolBox \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -archivePath "build/Ares2ToolBox.xcarchive" \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--deep --force" \
            PRODUCT_BUNDLE_IDENTIFIER=com.ars.decrypt.ios \
            ONLY_ACTIVE_ARCH=NO \
            VALID_ARCHS="arm64 arm64e" \
            ARCHS="arm64 arm64e" \
            2>&1 | tee xcodebuild_archive.log

      - name: Check archive
        run: |
          if [ -d "build/Ares2ToolBox.xcarchive" ]; then
            echo "Archive created successfully"
            ls -la "build/Ares2ToolBox.xcarchive/"
          else
            echo "Archive creation failed"
            echo "=== Build directory contents ==="
            find build -type f -o -type d 2>/dev/null || echo "build/ directory is empty"
            echo "=== xcodebuild log (last 50 lines) ==="
            tail -50 xcodebuild_archive.log 2>/dev/null || true
            exit 1
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "build/Ares2ToolBox.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist exportOptions.plist \
            2>&1 | tee xcodebuild_export.log

      - name: Check IPA
        run: |
          if [ -f "build/export/Ares2ToolBox.ipa" ]; then
            echo "IPA created: $(ls -lh build/export/Ares2ToolBox.ipa)"
          else
            echo "IPA not found, searching..."
            find build -name "*.ipa" -type f
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ares2ToolBox-iOS17-arm64e
          path: build/export/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild_archive.log
            xcodebuild_export.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
